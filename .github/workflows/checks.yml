name: 공개 집계·원문 차단 검증

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-portfolio.txt
      - name: 공개 집계 검증 환경 설치
        run: python -m pip install -r requirements-portfolio.txt
      - name: 집계·대표 노트북·파일 구조·원문 차단 검증
        env:
          MPLBACKEND: Agg
        run: make check
